<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">token-diet</title>
  <desc id="d">A Claude Code skill that cuts the tokens your sessions read, not just the ones they write.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1418"/>
      <stop offset="1" stop-color="#16212a"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fd3a6"/>
      <stop offset="1" stop-color="#9bbed6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <g font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace">
    <text x="80" y="150" font-size="76" font-weight="600" fill="#eef3f6">token-diet</text>
    <text x="80" y="205" font-size="24" fill="#aebac4">Cut what your Claude sessions read,</text>
    <text x="80" y="240" font-size="24" fill="#aebac4">not just what they write.</text>
    <text x="80" y="330" font-size="18" fill="#8d97a0">/token-diet  ·  Claude Code skill  ·  MIT</text>
  </g>
  <g font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="15" fill="#aebac4">
    <text x="760" y="118">where a session's tokens go (illustrative)</text>
    <text x="760" y="168">input: context, files, tool output</text>
    <rect x="760" y="180" width="440" height="26" rx="6" fill="#2a3640"/>
    <rect x="760" y="180" width="440" height="26" rx="6" fill="#9bbed6" opacity=".35"/>
    <text x="760" y="248">output: what the model writes</text>
    <rect x="760" y="260" width="440" height="26" rx="6" fill="#2a3640"/>
    <rect x="760" y="260" width="66" height="26" rx="6" fill="#9bbed6" opacity=".35"/>
    <text x="760" y="330" fill="#7fd3a6">token-diet trims the big bar first</text>
    <rect x="760" y="342" width="440" height="6" rx="3" fill="url(#cut)"/>
  </g>
</svg>
